[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slicer-agent-engine-benchmarks"
version = "0.2.0"
description = "Public benchmark subset with dataset loaders, deterministic judges, and Track3 runners"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "slicer-agent-engine contributors"}]
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "nibabel>=5.1.0",
  "Pillow>=10.0.0",
  "pydicom>=2.4.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
api = [
  "openai>=1.0.0",
  "google-genai>=1.0.0",
  "anthropic>=0.39.0",
]

[tool.setuptools.packages.find]
include = ["slicer_agent_engine*"]
